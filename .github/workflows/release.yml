name: Release

# Publishes @pance/tokens and @pance/react to npm when a GitHub release is published.
# Auth, in order of preference:
#  1. npm trusted publishing (OIDC), no stored secret. Configure it on npmjs.com for each package
#     (Settings → Trusted publishing → GitHub Actions · lermajonathan/pance-ds · release.yml).
#     npm only allows this once a package exists, so:
#  2. First release only: a short-lived granular token saved as the NPM_TOKEN repo secret.
#     After the first publish, set up trusted publishing and delete the secret.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry-run:
        description: Pack and verify without publishing
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write # required for trusted publishing and provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@11 # trusted publishing needs npm ≥ 11.5
      - run: pnpm install --frozen-lockfile
      - name: Release tag matches the package versions
        if: github.event_name == 'release'
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          for p in tokens react; do
            V=$(node -p "require('./packages/$p/package.json').version")
            [ "$V" = "$TAG" ] || { echo "::error::packages/$p is $V but the release is $TAG"; exit 1; }
          done
      - run: pnpm test:contrast
      - run: pnpm lint:tokens
      - run: pnpm typecheck
      - run: pnpm build:packages
      - run: pnpm test:packages
      - name: Publish @pance/tokens
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        working-directory: packages/tokens
        run: npm publish ${{ inputs.dry-run && '--dry-run' || '' }}
      - name: Publish @pance/react
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        working-directory: packages/react
        run: npm publish ${{ inputs.dry-run && '--dry-run' || '' }}
